name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      browser_e2e:
        description: Run the exceptional browser integration suite
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  docs:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-doc-links.test.mjs
      - run: node scripts/check-doc-links.mjs

  backend:
    needs: docs
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run test:ci

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:ci
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Verify browser routing without a browser
        run: node .github/scripts/browser-test-scope.test.mjs
      - name: Select exceptional browser coverage
        id: browser_scope
        run: node .github/scripts/browser-test-scope.mjs
      - if: steps.browser_scope.outputs.run_browser == 'true'
        run: npm ci
        working-directory: backend
      - if: steps.browser_scope.outputs.run_browser == 'true'
        run: npm ci
        working-directory: frontend
      - if: steps.browser_scope.outputs.run_browser == 'true'
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - if: steps.browser_scope.outputs.run_browser == 'true'
        run: npm run test:e2e
        working-directory: frontend
